name: CI

# Fast feedback for changes pushed from the web (Codex / GitHub UI) before they
# reach the deploy workflow. Build and tests are blocking; lint is informational
# (the codebase currently has many pre-existing lint errors).

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Unit tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
