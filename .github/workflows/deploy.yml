name: Deploy (production)

# Deploys WAMS to the GMGI Vercel project.
#
# Why this exists: Vercel's own Git integration blocks deployments whose commit
# author is not a member of the Vercel team ("commit author doesn't have
# permission to create deployments for this project"). Commits pushed from the
# web (ChatGPT Codex, GitHub UI, other machines) hit that wall. This workflow
# deploys with a team-owned VERCEL_TOKEN instead, so the commit author no longer
# matters. Vercel's native auto-deploy for `main` is turned off in vercel.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Cf4jFHGaoEIprOnJnp9HxtF8
  VERCEL_PROJECT_ID: prj_peLoedwajLddA6H2O9C5eOfkcqa6

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize HEAD commit author for Vercel's team check
        # Vercel blocks deployments whose commit author is not a Vercel team
        # member, and the CLI reads the author from git even for token deploys.
        # Re-stamp HEAD (local to this runner only, never pushed) as the Vercel
        # account that owns the project so the deploy is always accepted.
        run: |
          git config user.email "gmgisolutionsltdit@gmail.com"
          git config user.name "GMGI Solutions LTD"
          git commit --amend --reset-author --no-edit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "$url"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production alias: https://wams-gmgi.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- This build: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
