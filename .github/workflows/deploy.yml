name: Deploy (production)

# Deploys WAMS to the GMGI Vercel project (team `gmgi`, project `wams`).
#
# Why it's shaped like this:
#  * Vercel's own Git integration blocks deployments whose commit author is not a
#    Vercel team member ("commit author doesn't have permission..."). Commits
#    pushed from the web (ChatGPT Codex, GitHub UI, other machines) hit that. The
#    "Normalize HEAD author" step re-stamps HEAD locally on the runner (never
#    pushed) as the Vercel account that owns the project, so the deploy is
#    always accepted. Vercel's native auto-deploy for `main` is turned off in
#    vercel.json so this workflow is the single deploy path.
#  * The VERCEL_TOKEN is project-scoped and cannot read team-level endpoints, so
#    `vercel pull` / `vercel build` are avoided. `vercel deploy` uploads the
#    source and Vercel builds it in the cloud with the project's own env vars
#    (VITE_SUPABASE_URL, etc. — already configured on the project).
#  * .vercel/project.json is committed (IDs + non-secret settings) so the CLI
#    knows the project without a link step.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize HEAD commit author for Vercel's team check
        run: |
          git config user.email "gmgisolutionsltdit@gmail.com"
          git config user.name "GMGI Solutions LTD"
          git commit --amend --reset-author --no-edit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        run: |
          url="$(vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN")"
          echo "$url"
          {
            echo "### Deployed to production"
            echo ""
            echo "- Live: https://wams-gmgi.vercel.app"
            echo "- Build: $url"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
